name: Build Android NDK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r28" >> $GITHUB_ENV

      - name: Build with NDK
        run: |
          TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          # NDK r28 用自带 clang 即可，它知道 sysroot 在哪
          $TOOLCHAIN/clang++ \
            --target=aarch64-linux-android28 \
            -I include -I include/ImGui \
            -I include/Android_draw \
            -I include/Android_touch \
            -I include/native_surface \
            -I include/native_surface/aosp \
            -std=c++17 -fPIE \
            src/main.cpp src/res/cJSON.c \
            src/Android_draw/draw.cpp \
            src/Android_touch/TouchHelperA.cpp \
            src/ImGui/imgui.cpp src/ImGui/imgui_draw.cpp \
            src/ImGui/imgui_tables.cpp src/ImGui/imgui_widgets.cpp \
            src/ImGui/imgui_impl_android.cpp \
            src/ImGui/imgui_impl_opengl3.cpp \
            src/ImGui/imgui_switch.cpp src/ImGui/stb_image.cpp \
            -lEGL -lGLESv2 -lGLESv3 -landroid -llog -ldl -lm -lc \
            -o my_binary_arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my_binary_arm64
          path: my_binary_arm64
